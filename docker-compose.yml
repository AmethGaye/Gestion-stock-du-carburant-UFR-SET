services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carburant_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./storage:/var/www/storage
    environment:
      - APP_ENV=production
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-gsc_ufr_set}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-ahmada}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - carburant_net

  nginx:
    image: nginx:alpine
    container_name: carburant_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - carburant_net

  db:
    image: mysql:8.0
    container_name: carburant_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-gsc_ufr_set}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-ahmada}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-ahmada}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - carburant_net

networks:
  carburant_net:
    driver: bridge

volumes:
  db_data:
